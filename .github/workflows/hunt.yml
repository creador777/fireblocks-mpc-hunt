name: fireblocks-mpc-hunt

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      shard_count:
        description: Canary wave size
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "5"
          - "15"
          - "25"
      budget_seconds:
        description: Per-shard runtime
        required: true
        default: "300"
        type: choice
        options:
          - "300"
          - "900"
          - "3600"
          - "20700"
      workers:
        description: Fork-mode workers per shard (4 requires exact approved tuple)
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "4"

permissions:
  contents: read

concurrency:
  group: fireblocks-mpc-hunt
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FIREBLOCKS_HUNT_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      seconds: ${{ steps.plan.outputs.seconds }}
      workers: ${{ steps.plan.outputs.workers }}
      profile: ${{ steps.plan.outputs.profile }}
      brain_sha: ${{ steps.brain_revision.outputs.sha }}
    steps:
      - name: Checkout wave planner without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: hunt

      - name: Reject full workflow reruns that could repin the brain
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "${RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          if ! (( RUN_ATTEMPT == 1 )); then
            printf '%s\n' \
              'status=fail_closed code=full_rerun_requires_new_wave' >&2
            exit 64
          fi

      - name: Require private brain read credential in plan
        env:
          READ_TOKEN: ${{ secrets.FIREBLOCKS_BRAIN_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${READ_TOKEN}"

      - name: Checkout private brain revision for the wave
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: creador777/fireblocks-mpc-brain
          ref: corpus-pool
          token: ${{ secrets.FIREBLOCKS_BRAIN_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: brain-plan

      - name: Resolve one exact private brain revision
        id: brain_revision
        working-directory: brain-plan
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git cat-file -t "${sha}")" = commit
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"

      - name: Build a closed wave plan
        id: plan
        env:
          REQUESTED_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.shard_count || vars.FIREBLOCKS_SHARD_COUNT }}
          REQUESTED_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.budget_seconds || vars.FIREBLOCKS_BUDGET_SECONDS }}
          REQUESTED_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || '1' }}
          APPROVED_TUPLE: ${{ github.event_name == 'workflow_dispatch' && vars.FIREBLOCKS_HUNT_APPROVED_TUPLE || '' }}
          APPROVED_UNTIL_EPOCH: ${{ github.event_name == 'workflow_dispatch' && vars.FIREBLOCKS_HUNT_APPROVED_UNTIL_EPOCH || '' }}
        run: |
          set -euo pipefail
          bash hunt/scripts/plan_wave.sh \
            "${REQUESTED_COUNT}" "${REQUESTED_WORKERS}" \
            "${REQUESTED_SECONDS}" "${APPROVED_TUPLE}" "${APPROVED_UNTIL_EPOCH}"

  hunt:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.count) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout public hunt without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: hunt

      - name: Checkout pinned upstream without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fireblocks/mpc-lib
          ref: 00ae08b7f1bdbb887aedece384aca2f942aae432
          persist-credentials: false
          path: upstream

      - name: Require separate private read and write credentials
        env:
          READ_TOKEN: ${{ secrets.FIREBLOCKS_BRAIN_READ_TOKEN }}
          WRITE_TOKEN: ${{ secrets.FIREBLOCKS_BRAIN_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${READ_TOKEN}"
          test -n "${WRITE_TOKEN}"
          test "${READ_TOKEN}" != "${WRITE_TOKEN}"

      - name: Checkout pinned private brain read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: creador777/fireblocks-mpc-brain
          ref: ${{ needs.plan.outputs.brain_sha }}
          token: ${{ secrets.FIREBLOCKS_BRAIN_READ_TOKEN }}
          persist-credentials: false
          path: brain

      - name: Build fuzzer from pinned source
        working-directory: hunt
        env:
          FIREBLOCKS_UPSTREAM_DIR: ${{ github.workspace }}/upstream
        run: bash scripts/build_fuzzer_image.sh "fireblocks-mpc-hunt:${GITHUB_RUN_ID}-${{ matrix.shard }}"

      - name: Materialize deterministic 24-unit corpus window privately
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          mkdir -p "${root}/corpus" "${root}/output/private_plain" \
            "${root}/state" "${root}/upload"
          if python3 scripts/materialize_window.py \
            "${root}/corpus" \
            "${SHARD}" \
            "${{ needs.plan.outputs.count }}" \
            "${GITHUB_RUN_NUMBER}" \
            "${GITHUB_WORKSPACE}/hunt/seeds/cmp_ecdsa_online/corpus" \
            "${GITHUB_WORKSPACE}/brain/corpus/cmp_ecdsa_online" \
            >"${root}/output/private_plain/materialize.log" 2>&1
          then
            rm -f -- "${root}/output/private_plain/materialize.log"
            rmdir -- "${root}/output/private_plain"
          else
            exit 1
          fi
          test ! -e "${root}/output/private_plain"
          total="$(find "${root}/corpus" -mindepth 1 -maxdepth 1 -type f | wc -l)"
          (( total >= 1 && total <= 24 ))

      - name: Execute isolated shard
        id: fuzz
        continue-on-error: true
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
          BUDGET_SECONDS: ${{ needs.plan.outputs.seconds }}
          FIREBLOCKS_HUNT_WORKERS: ${{ needs.plan.outputs.workers }}
          FIREBLOCKS_HUNT_PROFILE: ${{ needs.plan.outputs.profile }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          bash scripts/run_fuzzer_shard.sh \
            "fireblocks-mpc-hunt:${GITHUB_RUN_ID}-${SHARD}" \
            "${SHARD}" "${BUDGET_SECONDS}" "${root}/corpus" "${root}/output"

      - name: Validate shard corpus before any publication
        id: validate_corpus
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          python3 scripts/validate_corpus.py "${root}/corpus"

      - name: Construct seven-field summary privately
        id: summary
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          python3 scripts/public_summary.py \
            "${root}/output/private_plain" cmp_ecdsa_online "${SHARD}" \
            "${root}/state/summary.public"

      - name: Encrypt evidence and verify plaintext cleanup
        id: finalize
        # Private finalizer (R3-4): runs even when a post-fuzzer gate (corpus
        # validation, seven-field summary) failed, so evidence is always
        # secured before the failure propagates. On any failure this step
        # exits non-zero, so upload and publish below never run.
        if: ${{ always() }}
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
          VALIDATE_OUTCOME: ${{ steps.validate_corpus.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          bundle="${root}/upload/incident-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}.gpg"
          bash scripts/cloud_finalize_incident.sh \
            "${root}/output/private_plain" \
            "${bundle}" \
            "${VALIDATE_OUTCOME}" "${SUMMARY_OUTCOME}"
          test ! -e "${root}/output/private_plain"
          test -s "${bundle}"
          test "$(find "${root}/upload" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload encrypted bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/fireblocks-${{ matrix.shard }}/upload/incident-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}.gpg
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

      - name: Revalidate shard corpus before private publish
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          python3 scripts/validate_corpus.py "${root}/corpus"

      - name: Publish corpus and encrypted incident to a unique private branch
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
          FIREBLOCKS_BRAIN_WRITE_TOKEN: ${{ secrets.FIREBLOCKS_BRAIN_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/fireblocks-${SHARD}"
          bash scripts/publish_ingest.sh \
            "${root}/corpus" \
            "${root}/upload/incident-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}.gpg" \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${SHARD}"

      - name: Emit only the seven-field public summary
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/emit_summary.py "${RUNNER_TEMP}/fireblocks-${SHARD}/state/summary.public"

      - name: Preserve finding/tool failure status
        working-directory: hunt
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/enforce_summary_status.py "${RUNNER_TEMP}/fireblocks-${SHARD}/state/summary.public"

  aggregate:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
      - plan
      - hunt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout public collector without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: hunt

      - name: Aggregate the exact private ingest set
        working-directory: hunt
        env:
          FIREBLOCKS_BRAIN_WRITE_TOKEN: ${{ secrets.FIREBLOCKS_BRAIN_WRITE_TOKEN }}
        run: bash scripts/aggregate_ingest.sh "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${{ needs.plan.outputs.count }}"
